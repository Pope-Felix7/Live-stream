<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Password Reset</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'accounts/style.css' %}" />
  </head>
  <body>
    <div class="auth-container">
      <h1>🎥 FELIX-LIVE</h1>
      <h2>Reset Password</h2>
      <form method="post">
        {% csrf_token %}{{ form.as_p }}<button type="submit">
          Send Reset Link
        </button>
      </form>
      <p><a href="{% url 'login' %}">Back to Login</a></p>
    </div>
  </body>
</html>
